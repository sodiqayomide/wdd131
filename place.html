<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
    content="Discover Nigeria, its people, culture, capital city, geography, population and weather conditions.">
    <meta name="author" content="Jamiu Sodiq Ayomide">

    <title>Discover Nigeria | place</title>

    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header>
        <h1>Nigeria</h1>
    </header>
    <main>
        <div class="hero">
            <picture>
                <source srcset="images/nigeria-large.webp" media="(min-width:600px)">
                <img src="images/nigeria-small.webp" alt="Beautiful landscape in Nigeria">
            </picture>
        </div>
        <section class="country-info">
            <h2>About Nigeria</h2>
            <p><strong>Capital:</strong>Abuja</p>
            <p><strong>Population:</strong>About 230million</p>
            <p><strong>Area:</strong>923,768 km²</p>
            <p><strong>Currency:</strong>Nigeria Naira (₦)</p>
            <p><strong>Official Language</strong>English</p>
        </section>
        <section class="weather">
            <h2>Weather</h2>
            <img src="images/weather.svg" alt="partly cloudy weather icon">
            <p><strong>Condition:</strong> partly Cloudy</p>
            <p><strong>Temperature:</strong> 8 ℃</p>
            <p><strong>Wind Speed</strong> 10 km/h</p>
            <p><strong>Windchill:</strong> <span id="windchill"></span></p>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Jamiu Sodiq Ayomide | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
